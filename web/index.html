<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoPro Viewer</title>
  <meta name="theme-color" content="#171a21">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>GoPro Viewer</div>
    <form id="root-form" class="root-form" autocomplete="off">
      <input id="root-input" type="text" placeholder="Add media folder (absolute path, e.g. /Volumes/GOPRO/DCIM)" spellcheck="false">
      <button type="submit" class="btn">Add folder</button>
      <button type="button" id="rescan-btn" class="btn btn-ghost" title="Rescan media roots">Rescan</button>
      <button type="button" id="import-btn" class="btn" title="Copy new clips from the GoPro connected by USB into a folder of your choice">Import from camera</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-head">
      <input id="search" type="search" placeholder="Filter recordings…" spellcheck="false">
      <div id="roots" class="roots"></div>
    </div>
    <div id="library" class="library" role="list"></div>
  </aside>

  <main class="main">
    <section class="stage">
      <div class="video-wrap" id="video-wrap">
        <video id="video" playsinline preload="metadata" muted></video>
        <div id="hud" class="hud">
          <div class="hud-speed"><span id="hud-speed">   --</span><small>km/h</small></div>
          <div class="hud-grid">
            <div><label>ALT</label><span id="hud-alt" class="v1">--</span></div>
            <div><label>GPS</label><span id="hud-fix" class="v2 fix">--</span></div>
            <div><label>LAT</label><span id="hud-lat" class="v1">--</span></div>
            <div><label>LON</label><span id="hud-lon" class="v2">--</span></div>
            <div><label>UTC</label><span id="hud-utc" class="v1">--</span></div>
            <div><label>LOCAL</label><span id="hud-local" class="v2">--</span></div>
            <div><label>G</label><span id="hud-acc" class="v1">--</span></div>
            <div><label>CH</label><span id="hud-chapter" class="v2">--</span></div>
          </div>
        </div>
        <div id="gauges" class="gauges hidden"></div>
        <div id="video-overlay" class="video-overlay hidden"></div>
      </div>
      <div class="map-wrap">
        <div id="map"></div>
        <div id="stats" class="stats"></div>
      </div>
    </section>

    <section class="controls">
      <div class="controls-left">
        <button id="btn-prev" class="btn btn-icon" title="Previous chapter ([)">⏮</button>
        <button id="btn-back" class="btn btn-icon" title="Back 5 s (←)">−5s</button>
        <button id="btn-play" class="btn btn-icon btn-primary" title="Play / Pause (Space)">▶</button>
        <button id="btn-fwd" class="btn btn-icon" title="Forward 5 s (→)">+5s</button>
        <label class="ctl" title="Step taken by ← / → and the −/+ buttons (Shift = ×6). A frame step pauses playback.">Skip
          <select id="skip-step">
            <optgroup label="Frames">
              <option value="1f">1 frame</option><option value="2f">2 frames</option>
              <option value="5f">5 frames</option><option value="10f">10 frames</option>
            </optgroup>
            <optgroup label="Seconds">
              <option value="1s">1 s</option><option value="2s">2 s</option><option value="3s">3 s</option><option value="5s" selected>5 s</option>
              <option value="10s">10 s</option><option value="15s">15 s</option><option value="30s">30 s</option><option value="60s">60 s</option>
            </optgroup>
          </select>
        </label>
        <button id="btn-next" class="btn btn-icon" title="Next chapter (])">⏭</button>
        <span class="time"><span id="time-cur">0:00.0</span> / <span id="time-total">0:00.0</span></span>
      </div>
      <div class="controls-right">
        <label class="ctl">Speed
          <select id="rate">
            <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
            <option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option>
          </select>
        </label>
        <label class="ctl toggle" title="Play the low-resolution LRV proxy instead of the full-quality file"><input type="checkbox" id="proxy"> Proxy (LRV)</label>
        <label class="ctl toggle" title="Keep the map centred on the current position (M)"><input type="checkbox" id="follow" checked> Follow</label>
        <label class="ctl toggle" title="Colour the route by speed instead of travelled / remaining"><input type="checkbox" id="color-speed"> Speed colours</label>
        <label class="ctl toggle" title="Show telemetry overlay on the video (H)"><input type="checkbox" id="hud-toggle" checked> HUD</label>
        <label class="ctl toggle" title="Show G-force / gyro / attitude gauges on the video (G)"><input type="checkbox" id="gauges-toggle" checked> Gauges</label>
        <span class="ctl links export">Export
          <a id="export-gpx" class="btn btn-ghost disabled" href="#" download>GPX</a>
          <a id="export-geojson" class="btn btn-ghost disabled" href="#" download title="Driven route as GeoJSON (LineString per run, altitude, per-point times and speeds)">GeoJSON</a>
          <a id="export-csv" class="btn btn-ghost disabled" href="#" download>CSV</a>
          <a id="export-accl" class="btn btn-ghost disabled" href="#" download>IMU</a>
        </span>
      </div>
    </section>

    <section class="timeline-wrap"><canvas id="timeline"></canvas></section>

    <section class="charts" id="charts"></section>
  </main>

  <dialog id="import-dialog" class="dialog">
    <div class="dialog-head">
      <h2>Import from camera</h2>
      <span id="import-camera" class="dialog-sub" aria-live="polite"></span>
      <button type="button" id="import-close" class="btn btn-ghost btn-icon" title="Close (Esc) — a running import carries on">✕</button>
    </div>
    <div class="import-options">
      <div class="import-dest">Destination
        <code id="import-dest" class="import-path" title="Clips are filed under <destination>/<YYYY-MM-DD>/"></code>
        <button type="button" id="import-choose" class="btn" title="Pick the destination in the Mac's folder panel">Choose folder…</button>
      </div>
      <div class="import-modes">
        <label class="ctl toggle" title="Every clip with the camera's LRV proxy (photos too); THM thumbnails are never imported"><input type="radio" name="import-mode" value="all" checked> All files <small>MP4 + LRV</small></label>
        <label class="ctl toggle" title="MP4 files only — no proxies, no photos"><input type="radio" name="import-mode" value="mp4"> MP4 only</label>
      </div>
    </div>
    <div id="import-list" class="import-list"></div>
    <div id="import-progress" class="import-progress hidden"><div class="bar"><div id="import-bar"></div></div></div>
    <div class="dialog-foot">
      <span id="import-summary" class="dialog-sub"></span>
      <button type="button" id="import-retry" class="btn btn-ghost" title="Probe the camera again">Look again</button>
      <button type="button" id="import-stop" class="btn hidden" title="Stop the import — the file in flight is kept as .part and resumes next time">Stop</button>
      <button type="button" id="import-start" class="btn btn-primary" disabled>Import</button>
    </div>
  </dialog>

  <div id="toasts" class="toasts"></div>

  <script src="/vendor/maplibre/maplibre-gl.js"></script>
  <script src="/vendor/uplot/uPlot.iife.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
